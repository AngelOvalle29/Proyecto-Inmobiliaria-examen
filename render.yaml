# Configuración del backend en Render, versionada como el código
# (spec 002, §5.1). Render la lee como "Blueprint" desde la rama main.
#
# Los secretos NO van aquí: las variables con "sync: false" se piden en el
# panel de Render al crear el Blueprint, y solo existen allí.

services:
  - type: web
    name: inmobiliaria-api
    runtime: docker
    # Plan gratuito: 512 MB, se duerme tras 15 minutos sin tráfico.
    plan: free
    # Este de Estados Unidos, cerca de Neon y de CloudAMQP (spec 002, §4).
    region: virginia
    branch: main
    # Solo cambios dentro de backend/ disparan un despliegue.
    rootDir: backend
    # Con rootDir definido, Render resuelve estas rutas relativas a backend/,
    # no a la raíz del repositorio. Lo comprobó el primer despliegue: con
    # "./backend" buscaba backend/backend y fallaba.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render llama aquí con el host <servicio>.onrender.com; prod.py lo agrega
    # a ALLOWED_HOSTS desde RENDER_EXTERNAL_HOSTNAME.
    healthCheckPath: /api/v1/health/
    # "commit" y no "checksPass": GitHub Actions no se está ejecutando (#14), y
    # esperar las verificaciones bloquearía todos los despliegues.
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: NUM_PROXIES
        value: "1"
      - key: CARGAR_DATOS_DEMO
        value: "true"
      # Se genera a mano con al menos 50 caracteres: el valor que genera
      # Render ("generateValue") es más corto y prod.py lo rechazaría.
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_NOMBRE_COMPLETO
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # Frontend como sitio estático gratuito (spec 002, §6.1). Es TEMPORAL: Vercel
  # pidió una verificación manual de la cuenta, y mientras se resuelve el
  # frontend se publica aquí. Los sitios estáticos de Render no se duermen.
  - type: web
    name: inmobiliaria-web
    runtime: static
    branch: main
    # Sin rootDir a propósito. Con rootDir, Render resolvió las rutas de la API
    # relativas a backend/ aunque su documentación dice que son relativas a la
    # raíz. Aquí se entra a la carpeta en el comando y la ruta de publicación
    # se escribe completa: es correcta con cualquiera de las dos reglas.
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    # Pendiente para la base del frontend (#15): una regla de reescritura de
    # /* a /index.html, para que recargar una ruta de React no dé 404. Hoy hay
    # una sola página y no hace falta.
    envVars:
      # Vite 8 necesita Node 20.19 o superior; se fija la misma versión que
      # usa ci.yml.
      - key: NODE_VERSION
        value: "24"
      - key: VITE_ENTORNO
        value: produccion
      # No es secreta (queda visible en el código compilado), pero depende del
      # nombre que Render le dio a la API: se carga en el panel.
      - key: VITE_API_URL
        sync: false
