name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend — calidad y pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: inmobiliaria_test
          POSTGRES_USER: inmobiliaria
          POSTGRES_PASSWORD: inmobiliaria
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://inmobiliaria:inmobiliaria@localhost:5432/inmobiliaria_test
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: clave-solo-para-pruebas
      DEBUG: "False"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 shared-mime-info

      - name: Instalar dependencias de Python
        run: pip install -r requirements/dev.txt

      - name: Revisar formato
        run: ruff format --check .

      - name: Revisar estilo
        run: ruff check .

      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Correr pruebas
        run: pytest --cov=apps --cov-report=term-missing

  frontend:
    name: Frontend — calidad y compilación
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Mientras el frontend no exista (antes de la fase 2) este trabajo se
      # salta solo en lugar de fallar.
      - name: Verificar si el frontend existe
        id: existe
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "resultado=si" >> "$GITHUB_OUTPUT"
          else
            echo "resultado=no" >> "$GITHUB_OUTPUT"
            echo "El frontend aún no existe; se omite este trabajo."
          fi

      - name: Preparar Node
        if: steps.existe.outputs.resultado == 'si'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.existe.outputs.resultado == 'si'
        run: npm ci

      - name: Revisar estilo
        if: steps.existe.outputs.resultado == 'si'
        run: npm run lint

      - name: Verificar tipos
        if: steps.existe.outputs.resultado == 'si'
        run: npm run typecheck

      - name: Compilar
        if: steps.existe.outputs.resultado == 'si'
        run: npm run build
        env:
          VITE_API_URL: https://ejemplo.invalido/api/v1
